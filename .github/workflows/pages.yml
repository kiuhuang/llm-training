name: Deploy tutorial to GitHub Pages

# Publishes the multilingual interactive tutorial (tutorial/) as the site
# root, with README.md alongside it (the tutorial's nav links to ../README.md).
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r tutorial/. _site/
          cp README.md _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # create the Pages site automatically if it doesn't exist yet —
          # no manual "Settings → Pages → Source: GitHub Actions" click needed
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
